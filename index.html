<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Quick Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="titulo"> Quick Summary </h1>
    <p class="texto_introdutorio"> Cole um <strong class="negrito">texto</strong> ou envie uma <strong class="negrito">imagem</strong> para obter um resumo rápido.</p>

    <form id="formResumo" enctype="multipart/form-data">
        <label for="texto"><strong>Cole o texto aqui:</strong></label>
        <textarea name="texto" id="texto" rows="10" placeholder="Insira um longo texto para ser resumido..."></textarea>
        
        <label for="imagem"><strong class="negrito">Ou envie uma imagem:</strong></label>
        <input type="file" name="imagem" id="imagem" accept="image/jpeg, image/png, image/gif" placeholder="Envie uma imagem (JPEG ou PNG)">
        
        <button type="submit">Gerar Resumo</button>
    </form>
    
    <div id="status"></div>
    <div id="resultado">
        <h3>Resumo:</h3>
        <p id="textoResumo"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
